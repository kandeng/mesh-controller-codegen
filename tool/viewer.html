<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Controller Visual Gate</title>
<style>
  body { margin: 0; font-family: system-ui, sans-serif; background: #101418; color: #dde; }
  #view { position: fixed; inset: 0; }
  #panel { position: fixed; top: 12px; left: 12px; width: 320px; background: rgba(16,20,24,.88);
           border: 1px solid #345; border-radius: 10px; padding: 14px; backdrop-filter: blur(4px); }
  #panel h1 { font-size: 15px; margin: 0 0 10px; }
  .row { margin: 10px 0; font-size: 13px; }
  .row label { display: flex; justify-content: space-between; margin-bottom: 4px; }
  input[type=range] { width: 100%; }
  .btns { display: flex; gap: 6px; }
  .btns button { flex: 1; padding: 7px 0; border: 1px solid #468; border-radius: 6px;
                 background: #1b2530; color: #cde; cursor: pointer; font-size: 12px; }
  .btns button.active { background: #2b6cb0; border-color: #63b3ed; color: #fff; }
  #state { margin-top: 10px; font-family: ui-monospace, monospace; font-size: 11px;
           white-space: pre-wrap; color: #9fb; min-height: 90px; }
  #status { color: #f88; font-size: 12px; margin-top: 6px; white-space: pre-wrap; }
  #checks { font-size: 11px; color: #bcd; margin-top: 8px; line-height: 1.5; }
</style>
<script type="importmap">
{ "imports": {
    "three": "/client/node_modules/three/build/three.module.js",
    "three/addons/": "/client/node_modules/three/examples/jsm/"
} }
</script>
</head>
<body>
<div id="view"></div>
<div id="panel">
  <h1>Controller Visual Gate</h1>
  <div class="row">
    <label><span>Speed (m/s)</span><span id="speedVal">0.0</span></label>
    <input id="speed" type="range" min="0" max="10" step="0.1" value="0" />
  </div>
  <div class="row btns">
    <button id="turnL">⟲ Turn Left</button>
    <button id="straight" class="active">Straight</button>
    <button id="turnR">Turn Right ⟳</button>
  </div>
  <div class="row">
    <label><span>Gimbal Pitch (°)</span><span id="pitchVal">0</span></label>
    <input id="pitch" type="range" min="-90" max="30" step="1" value="0" />
  </div>
  <div class="row">
    <label><span>Gimbal Yaw (°)</span><span id="yawVal">0</span></label>
    <input id="yaw" type="range" min="-120" max="120" step="1" value="0" />
  </div>
  <div id="state">loading…</div>
  <div id="checks">Verify by eye:
1. blades spin WITH hubs
2. camera body follows gimbal joints
3. turns differentiate diagonal props
4. rpm grows with speed
5. props fully STOP at speed 0</div>
  <div id="status"></div>
</div>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const params = new URLSearchParams(location.search);
const glbUrl = params.get('glb') || '/client/assets/mesh/drone_dji_inspire3.glb';
const ctlUrl = params.get('ctl') || '/.dsh-lab/drone-controller.js';
const status = document.getElementById('status');

const view = document.getElementById('view');
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(devicePixelRatio);
view.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x101418);
scene.add(new THREE.HemisphereLight(0xbfd4ff, 0x30281e, 1.2));
const sun = new THREE.DirectionalLight(0xffffff, 1.6);
sun.position.set(5, 10, 6);
scene.add(sun);
scene.add(new THREE.GridHelper(20, 20, 0x335, 0x223));

const camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 0.01, 500);
const orbit = new OrbitControls(camera, renderer.domElement);

let ctl = null;
try {
  const mod = await import(/* @vite-ignore */ ctlUrl);
  new GLTFLoader().load(glbUrl, (gltf) => {
    const drone = gltf.scene;
    scene.add(drone);
    const box = new THREE.Box3().setFromObject(drone);
    const size = box.getSize(new THREE.Vector3());
    const center = box.getCenter(new THREE.Vector3());
    const radius = Math.max(size.x, size.y, size.z) || 1;
    drone.position.sub(center);
    camera.position.set(radius * 1.8, radius * 1.2, radius * 1.8);
    orbit.target.set(0, 0, 0);
    orbit.update();
    try {
      ctl = mod.createDroneController(drone, THREE);
      document.getElementById('state').textContent = 'controller created: ' + ctlUrl;
    } catch (e) { status.textContent = 'createDroneController threw: ' + e.message; }
  }, undefined, (e) => { status.textContent = 'GLB load failed: ' + e; });
} catch (e) {
  status.textContent = 'controller import failed: ' + e.message;
}

const $ = (id) => document.getElementById(id);
$('speed').addEventListener('input', () => {
  $('speedVal').textContent = (+$('speed').value).toFixed(1);
  ctl?.setSpeed(+$('speed').value);
});
function setTurn(btn) {
  for (const b of ['turnL', 'straight', 'turnR']) $(b).classList.toggle('active', b === btn);
  if (!ctl) return;
  if (btn === 'turnL') ctl.turnLeft?.();
  else if (btn === 'turnR') ctl.turnRight?.();
  else ctl.goStraight?.();
}
$('turnL').onclick = () => setTurn('turnL');
$('straight').onclick = () => setTurn('straight');
$('turnR').onclick = () => setTurn('turnR');
function applyGimbal() {
  $('pitchVal').textContent = $('pitch').value;
  $('yawVal').textContent = $('yaw').value;
  ctl?.setGimbal?.(+$('pitch').value, +$('yaw').value);
}
$('pitch').addEventListener('input', applyGimbal);
$('yaw').addEventListener('input', applyGimbal);

const clock = new THREE.Clock();
function tick() {
  requestAnimationFrame(tick);
  const dt = Math.min(clock.getDelta(), 0.1);
  try { ctl?.update(dt); } catch (e) { status.textContent = 'update() threw: ' + e.message; ctl = null; }
  orbit.update();
  renderer.render(scene, camera);
}
tick();
setInterval(() => {
  if (!ctl?.getState) return;
  try {
    const s = ctl.getState();
    $('state').textContent =
      `speed:   ${(+s.speed).toFixed(2)} m/s\n` +
      `heading: ${(+s.headingDeg).toFixed(1)}°\n` +
      (s.props || []).map(p => `prop ${p.name}: ${Math.round(p.rpm)} rpm`).join('\n') +
      `\ngimbal:  pitch ${(+s.gimbal?.pitch).toFixed(1)}°  yaw ${(+s.gimbal?.yaw).toFixed(1)}°`;
  } catch (e) { status.textContent = 'getState() threw: ' + e.message; }
}, 250);
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
